<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Occident</title>
<meta name="description" content="Occident surfaces crucial considerations in artificial intelligence, philosophy, and technology.">
<link rel="canonical" href="https://occident.institute/">

<meta property="og:type" content="website">
<meta property="og:url" content="https://occident.institute/">
<meta property="og:title" content="Occident">
<meta property="og:description" content="Occident surfaces crucial considerations in artificial intelligence, philosophy, and technology.">
<meta name="twitter:card" content="summary">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88' font-family='Georgia,serif'>O</text></svg>">

<style>
  :root {
    --ink: #16161a;
    --muted: #6b6b73;
    --rule: #dededa;
    --paper: #faf9f6;
    --accent: #8c2f24;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ece9e3;
      --muted: #918d86;
      --rule: #2e2e33;
      --paper: #131316;
      --accent: #c9705f;
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 2.5rem 1.5rem;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main {
    max-width: 34rem;
    width: 100%;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.6rem, 11vw, 4.25rem);
    font-weight: 400;
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    text-transform: uppercase;
    line-height: 1.05;
  }

  .rule {
    width: 3rem;
    height: 1px;
    margin: 2rem auto;
    border: 0;
    background: var(--accent);
  }

  p.lede {
    margin: 0;
    font-size: clamp(1.02rem, 2.6vw, 1.2rem);
    line-height: 1.65;
    color: var(--ink);
    text-wrap: balance;
  }

  .contact {
    margin: 2.75rem 0 0;
    font-size: 1rem;
  }

  a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 1px;
    transition: color 120ms ease;
  }

  a:hover,
  a:focus-visible {
    color: var(--accent);
  }

  footer {
    margin-top: 4.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--rule);
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 0.74rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1.8;
  }
</style>
</head>
<body>

<main>
  <h1>Occident</h1>

  <hr class="rule">

  <p class="lede">
    Surfacing crucial considerations in artificial intelligence,
    philosophy, and technology.
  </p>

  <p class="contact">
    <a href="mailto:lydia@occident.institute">lydia@occident.institute</a>
  </p>

  <footer>
    San Francisco, California<br>
    A nonprofit public benefit corporation
  </footer>
</main>

</body>
</html>
